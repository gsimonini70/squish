# Production Profile
# ==================
# Activate with: --spring.profiles.active=prod

squish:
  # PRECEDENCE: active-profile WINS over mode. 'mode' is the legacy fallback and is
  # only applied when active-profile is unset/empty or names an unknown profile.
  # (Note: startup logs and the dashboard still DISPLAY 'mode' - see dist/config/application.yml.)
  mode: ${COMPRESSION_MODE:AGGRESSIVE}
  dry-run: ${DRY_RUN:false}

  # Named compression profile, resolved against squish.profiles in application.yml
  # (archival | office | web | confidential | custom-example).
  # Set ACTIVE_PROFILE to an empty value to fall back to the legacy 'mode' above.
  active-profile: ${ACTIVE_PROFILE:office}

  database:
    jdbc-url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB1}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    max-pool-size: 16

  # Query Configuration - table/column names
  query:
    master-table: ${MASTER_TABLE:OTTICA}
    detail-table: ${DETAIL_TABLE:OTTICAI}
    tracking-table: ${TRACKING_TABLE:SQUISH_PROCESSED}
    id-column: ${ID_COLUMN:OTT_ID}
    filename-column: ${FILENAME_COLUMN:OTT_NOME_FILE}
    detail-id-column: ${DETAIL_ID_COLUMN:OTTI_ID}
    detail-ctr-column: ${DETAIL_CTR_COLUMN:OTTI_CTR}
    data-column: ${DATA_COLUMN:OTTI_DATA}
    # Generic WHERE clause filter (e.g. "COL = 'val' AND COL2 IN ('a','b')")
    master-table-filter: ${MASTER_TABLE_FILTER:OTT_TIPO_DOC = '001030'}

  pipeline:
    worker-threads: ${WORKER_THREADS:16}
    id-from: ${ID_FROM:0}
    id-to: ${ID_TO:0}

  # HTTPS Dashboard (optional)
  http:
    port: ${HTTP_PORT:8080}
    ssl-enabled: ${HTTP_SSL_ENABLED:false}
    keystore-path: ${HTTP_KEYSTORE_PATH:}
    keystore-password: ${HTTP_KEYSTORE_PASSWORD:}
    keystore-type: ${HTTP_KEYSTORE_TYPE:PKCS12}
    ssl-protocol: ${HTTP_SSL_PROTOCOL:TLSv1.3}
    # Comma-separated origins, e.g. CORS_ALLOWED_ORIGINS=https://app.example.com,https://intranet.example.com
    # Unset/empty -> EMPTY list -> CORS disabled entirely (never a wildcard).
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  # Dashboard / API security - HTTP Basic on the write endpoints
  # (POST /api/config, /api/compress, /api/thumbnail). Read endpoints stay public.
  security:
    enabled: ${SECURITY_ENABLED:true}
    username: ${SECURITY_USERNAME:admin}
    # Deliberately NO default: if SECURITY_PASSWORD is unset this binds blank and
    # SecurityConfig generates a random password, logged once at WARN on every restart.
    # Set SECURITY_PASSWORD in squish.env (chmod 600) for a stable credential.
    password: ${SECURITY_PASSWORD:}

  watchdog:
    enabled: ${WATCHDOG_ENABLED:true}
    poll-interval-seconds: ${WATCHDOG_INTERVAL:300}

  # Report Configuration
  report:
    enabled: ${REPORT_ENABLED:true}
    directory: ${REPORT_DIRECTORY:reports}

  # Email with secure protocols
  email:
    enabled: ${EMAIL_ENABLED:true}
    smtp-host: ${SMTP_HOST:smtp.company.com}
    smtp-port: ${SMTP_PORT:587}
    smtp-user: ${SMTP_USER:}
    smtp-password: ${SMTP_PASSWORD:}
    ssl: ${SMTP_SSL:false}
    starttls: ${SMTP_STARTTLS:true}
    ssl-protocols: ${SMTP_SSL_PROTOCOLS:TLSv1.2,TLSv1.3}
    trust-all-certs: false
    connection-timeout: 10000
    read-timeout: 30000
    from: ${SMTP_FROM:pdf-compressor@company.com}
    to:
      - ${SMTP_TO:it-operations@company.com}

logging:
  level:
    root: WARN
    com.lucsartech.squish: INFO
