# PDF Compressor Modern - Configuration
# =====================================
# Use Spring profiles to switch between environments:
#   java -jar app.jar --spring.profiles.active=prod

spring:
  application:
    name: squish
  profiles:
    active: dev
  main:
    banner-mode: off
  # Jackson: omit null fields so the JSON contract matches the old Gson behaviour
  # (e.g. ProfilesResponse.activeProfile and the Float fields of ProfileDetailInfo).
  jackson:
    default-property-inclusion: non_null
  # Upload limits guard the /api/compress and /api/thumbnail endpoints against DoS.
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Compression settings
squish:
  mode: AGGRESSIVE  # Legacy: LOSSLESS, MEDIUM, AGGRESSIVE (used if no profile set)
  dry-run: false

  # Compression Profiles (v3.0+)
  # Use active-profile to select a named profile, or fall back to 'mode' above
  active-profile: office  # Use this named profile (comment out to use legacy 'mode')

  profiles:
    # Archival quality - lossless compression for long-term storage
    archival:
      description: "Archival quality - lossless compression"
      mode: LOSSLESS
      pdfa-enabled: true
      pdfa-conformance: PDF_A_2B

    # Standard office documents - balanced compression
    office:
      description: "Office documents - balanced compression"
      mode: MEDIUM

    # Maximum compression for web/email
    web:
      description: "Web/email - maximum compression"
      mode: AGGRESSIVE

    # Custom profile example with explicit settings
    custom-example:
      description: "Custom profile with explicit scale and quality"
      custom-scale-factor: 0.7   # 70% scale
      custom-jpeg-quality: 0.65  # 65% JPEG quality

    # Confidential documents with watermark (watermark feature coming soon)
    confidential:
      description: "Confidential documents with watermark"
      mode: MEDIUM
      watermark-enabled: true
      watermark-text: "CONFIDENTIAL"
      watermark-position: DIAGONAL
      watermark-opacity: 0.3

  database:
    jdbc-url: jdbc:oracle:thin:@//localhost:1521/ORCL
    username: user
    password: pass
    max-pool-size: 12

  # Query Configuration - table/column names
  query:
    master-table: OTTICA              # Main table with PDF metadata
    detail-table: OTTICAI             # Detail table with PDF data
    tracking-table: SQUISH_PROCESSED  # Tracking table for processed records
    id-column: OTT_ID                 # Primary key column
    filename-column: OTT_NOME_FILE    # Filename column
    detail-id-column: OTTI_ID         # Detail table ID column (composite PK part 1)
    detail-ctr-column: OTTI_CTR       # Detail table CTR column (composite PK part 2)
    data-column: OTTI_DATA            # BLOB column with PDF data
    # Generic WHERE clause filter for master table (without WHERE keyword)
    # Examples:
    #   "OTT_TIPO_DOC = '001030'"
    #   "OTT_TIPO_DOC IN ('001030','001031') AND OTT_STATUS = 'A'"
    #   "OTT_TIPO_DOC = '001030' AND OTT_DATA_INS > DATE '2024-01-01'"
    master-table-filter: "OTT_TIPO_DOC = '001030'"

  pipeline:
    worker-threads: 8
    id-from: 0
    id-to: 0  # 0 = no limit
    fetch-size: 200
    batch-size: 200
    queue-capacity: 500
    throttle-millis: 0

  # HTTP/HTTPS Dashboard Configuration
  http:
    port: 8080
    ssl-enabled: false                    # Enable HTTPS (fails fast if keystore missing)
    keystore-path: /path/to/keystore.p12  # Path to PKCS12 keystore
    keystore-password: changeit           # Keystore password
    keystore-type: PKCS12                 # PKCS12 or JKS
    ssl-protocol: TLSv1.3                 # TLSv1.2 or TLSv1.3
    # Cross-origin origins allowed to call the API. Empty = no CORS (no wildcard).
    cors-allowed-origins: []              # e.g. ["https://app.example.com"]

  # Web dashboard / API security (HTTP Basic on write endpoints)
  security:
    enabled: true                         # false = all endpoints public (tests / closed LAN)
    username: admin
    # password:                           # leave unset to auto-generate a random one (logged at WARN)

  watchdog:
    enabled: false
    poll-interval-seconds: 60

  # Report Configuration
  report:
    enabled: true                       # Enable/disable report generation
    directory: reports                  # Directory for PDF reports

  # Email Notification Configuration
  email:
    enabled: false
    # SMTP Server Settings
    smtp-host: smtp.example.com           # SMTP server hostname
    smtp-port: 587                        # 587 for STARTTLS, 465 for SSL
    smtp-user:                            # SMTP username (leave empty for no auth)
    smtp-password:                        # SMTP password
    # Security Settings
    ssl: false                            # Use direct SSL (port 465)
    starttls: true                        # Use STARTTLS upgrade (port 587)
    ssl-protocols: TLSv1.2,TLSv1.3        # Allowed TLS versions
    trust-all-certs: false                # Trust all certificates (NOT recommended for prod)
    # Timeout Settings
    connection-timeout: 10000             # Connection timeout in ms
    read-timeout: 30000                   # Read timeout in ms
    # Email Addresses
    from: noreply@example.com
    to:
      - admin@example.com

# Logging
logging:
  level:
    root: INFO
    com.lucsartech.squish: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %clr(%5level) %clr([%15.15thread]){magenta} %clr(%-40.40logger{39}){cyan} - %msg%n"
